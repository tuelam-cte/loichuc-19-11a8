<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A8 Premium Dedication</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://googleapis.com" rel="stylesheet">
</head>
<body>
    <!-- Hệ thống nền tạo hạt siêu mượt chống giật lag -->
    <div id="particles-background"></div>

    <div class="wrapper">
        <div class="premium-card">
            <div class="card-header">
                <span class="badge">A8 Special Edition</span>
                <h1 class="main-title">Gửi những chàng trai A8 ✨</h1>
                <div class="sub-title">From Girls of 8A8 with love</div>
            </div>

            <div class="card-body">
                <div class="text-dynamic-area">
                    <p id="typing-text"></p>
                </div>
            </div>

            <div class="card-footer">
                <div class="music-player-panel">
                    <div class="track-info">
                        <span class="music-icon">🎵</span>
                        <div class="track-details">
                            <span class="song-title">CORTIS Track</span>
                            <span class="artist-name">Lofi Premium</span>
                        </div>
                    </div>
                    <button class="control-music-btn" onclick="toggleAudioPlayer()">
                        <span id="play-status-text">PLAY TRACK</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Luồng âm thanh cấu hình chuẩn cao cấp -->
    <audio id="audio-core-player" loop preload="auto">
        <source src="https://soundhelix.com" type="audio/mpeg">
    </audio>

    <script src="script.js"></script>
</body>
</html>
